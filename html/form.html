<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir</title>
    <link rel="stylesheet" href="../css/content.css">
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
    <h2>Formulir Kontak / Masukan</h2>
    <p>Silakan isi form di bawah ini untuk mengirimkan pesan atau masukan kepada pengelola website kelas.</p>

    <form id="formKontak" class="form-container">
        <div class="form-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label for="nim">NIM / Email:</label>
            <input type="text" id="nim" name="nim" required placeholder="Masukkan NIM atau email">
        </div>

        <div class="form-group">
            <label for="pesan">Pesan / Masukan:</label>
            <textarea id="pesan" name="pesan" rows="4" required placeholder="Tuliskan pesan Anda di sini..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>

    <script src="../js/script.js"></script>
</body>
</html>
